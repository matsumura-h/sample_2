name: 🚀 機能要望・改善の提案
description: 新しい機能の追加や、既存機能の改善案はこちらから
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "製品をより良くするための素晴らしいアイデアをお待ちしています！"

  - type: textarea
    id: problem
    attributes:
      label: 💡 解決したい課題（背景）
      description: 「現在どんなことで困っているか」「なぜこの機能が必要か」を教えてください。
      placeholder: |
        例：現在の仕様では、CSVエクスポート機能が一度に10件しか処理できず、毎月のデータ集計に非常に時間がかかっています。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: ✨ 提案する機能・解決策（理想の挙動）
      description: 「具体的にどのような機能や画面になってほしいか」を詳しく教えてください。
      placeholder: |
        例：エクスポート画面に「全件ダウンロード」のボタンを追加し、期間指定をして一括でCSV保存できるようにしてほしいです。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🔥 あなたの考える優先度・重要度
      options:
        - "高（これがないと業務に重大な支障が出る）"
        - "中（あると非常に便利、業務が効率化する）"
        - "低（いつか実装されたら嬉しい）"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 代替案（もしあれば）
      description: すでに試した回避策や、他のツールでの実装例などがあれば記述してください。
      placeholder: |
        例：現在は手動で3ページ分コピー＆ペーストしてExcelにまとめています。
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 📎 補足情報・参考画像
      description: 画面のイメージラフや、参考にしたWebサイトのURL、スクリーンショットなどがあれば自由に貼り付けてください。
    validations:
      required: false
